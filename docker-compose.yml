# Deployment compose file (used as-is by Coolify and other PaaS/reverse proxies).
# No host ports are published: the proxy reaches the container on its internal
# network at port 8080. In Coolify, set the service domain to
# https://isms.example.com:8080 (the ":8080" tells the proxy the container port).
# For local use, docker-compose.override.yml adds a localhost-only port mapping.
services:
  isms:
    build:
      context: .
      args:
        ISMS_SITE_NAME: "ISMS Portal"
    image: isms-portal:latest
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
