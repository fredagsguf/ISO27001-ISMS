services:
  isms:
    build:
      context: .
      args:
        ISMS_SITE_NAME: "ISMS Portal"
    image: isms-portal:latest
    container_name: isms-portal
    # Bound to localhost by default: the ISMS is classified Internal.
    # Publish it only behind an authenticating reverse proxy or VPN.
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
